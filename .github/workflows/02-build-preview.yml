name: Build Print Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libcairo2-dev libffi-dev \
            libpango-1.0-0 libpangocairo-1.0-0

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build and verify all printable PDFs
        run: |
          python scripts/build_print_package.py \
            --output-dir "${RUNNER_TEMP}/handelsvindar-preview"

      - name: Upload preview package
        uses: actions/upload-artifact@v7
        with:
          name: handelsvindar-print-preview
          path: ${{ runner.temp }}/handelsvindar-preview/*
          if-no-files-found: error
          retention-days: 7
