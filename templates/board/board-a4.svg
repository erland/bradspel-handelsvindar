  <defs>{{DEFS}}</defs>
  <g id="background">{{BACKGROUND}}</g>
  <g id="terrain">{{TERRAIN}}</g>
  <g id="decorations">{{DECORATIONS}}</g>
  <g id="routes">{{CONNECTIONS}}</g>
  <g id="costs">{{COSTS}}</g>
  <g id="ports">{{PORTS}}</g>
  <g id="labels">{{LABELS}}</g>
  <g id="legend">{{LEGEND}}</g>
  <g id="title">{{TITLE}}</g>
  <g id="frame">{{FRAME}}</g>
</svg>
